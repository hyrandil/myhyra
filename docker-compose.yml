version: '3.8'
services:
  backend:
    build:
      context: ./backend
    volumes:
      - ./backend/app:/app/app
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - STORAGE_DIR=/app/data/raw
      - IMPORT_SHARES_ROOT=/app/data/import_shares
      - SECRET_KEY=change-this-secret
      - ALLOW_USER_REGISTRATION=false
      - ADMIN_DEFAULT_PASSWORD=changeme
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    environment:
      - VITE_BACKEND_URL=http://backend:8000
