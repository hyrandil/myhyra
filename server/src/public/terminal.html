<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zeiterfassung Terminal</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f8fafc;
        margin: 0;
        padding: 24px;
      }
      .card {
        max-width: 520px;
        margin: 0 auto;
        background: #fff;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.1);
      }
      h1 {
        margin-top: 0;
        font-size: 24px;
      }
      label {
        display: block;
        font-size: 14px;
        margin-top: 12px;
        color: #475569;
      }
      input, select, button {
        width: 100%;
        margin-top: 6px;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #cbd5f5;
        font-size: 14px;
      }
      button {
        background: #0284c7;
        color: #fff;
        border: none;
        margin-top: 16px;
        cursor: pointer;
        font-weight: 600;
      }
      .status {
        margin-top: 16px;
        padding: 12px;
        border-radius: 8px;
        background: #f1f5f9;
        font-size: 14px;
      }
      .success {
        background: #dcfce7;
        color: #166534;
      }
      .error {
        background: #fee2e2;
        color: #991b1b;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Erfassungsterminal</h1>
      <p>RFID scannen und eine Buchung an den Hauptserver senden.</p>

      <label for="serverUrl">Server URL</label>
      <input id="serverUrl" type="text" placeholder="https://api.example.com" />

      <label for="apiKey">API Key</label>
      <input id="apiKey" type="password" placeholder="API Key" />

      <label for="rfid">RFID Chipnummer</label>
      <input id="rfid" type="text" placeholder="RFID" autofocus />

      <label for="action">Aktion</label>
      <select id="action">
        <option value="CLOCK_IN">Kommen</option>
        <option value="CLOCK_OUT">Gehen</option>
      </select>

      <button id="send">Buchung senden</button>

      <div id="status" class="status">Bereit.</div>
    </div>

    <script>
      const serverUrlInput = document.getElementById('serverUrl');
      const apiKeyInput = document.getElementById('apiKey');
      const rfidInput = document.getElementById('rfid');
      const actionSelect = document.getElementById('action');
      const status = document.getElementById('status');
      const sendButton = document.getElementById('send');

      serverUrlInput.value = localStorage.getItem('terminalServerUrl') || '';
      apiKeyInput.value = localStorage.getItem('terminalApiKey') || '';

      const setStatus = (message, type) => {
        status.textContent = message;
        status.className = `status ${type || ''}`;
      };

      sendButton.addEventListener('click', async () => {
        const serverUrl = serverUrlInput.value.trim().replace(/\/$/, '');
        const apiKey = apiKeyInput.value.trim();
        const rfid = rfidInput.value.trim();
        const type = actionSelect.value;
        if (!serverUrl || !apiKey || !rfid) {
          setStatus('Bitte Server URL, API Key und RFID eingeben.', 'error');
          return;
        }
        localStorage.setItem('terminalServerUrl', serverUrl);
        localStorage.setItem('terminalApiKey', apiKey);
        setStatus('Sende Buchung...', '');
        try {
          const response = await fetch(`${serverUrl}/api/terminals/entry`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-api-key': apiKey
            },
            body: JSON.stringify({ rfid, type })
          });
          const data = await response.json();
          if (!response.ok) {
            setStatus(data.message || 'Fehler bei der Buchung.', 'error');
            return;
          }
          setStatus(`${type === 'CLOCK_IN' ? 'Kommen' : 'Gehen'}: ${data.user?.name || ''}`, 'success');
          rfidInput.value = '';
          rfidInput.focus();
        } catch (err) {
          setStatus('Netzwerkfehler beim Senden.', 'error');
        }
      });
    </script>
  </body>
</html>
